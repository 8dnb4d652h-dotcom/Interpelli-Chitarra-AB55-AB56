name: Aggiorna interpelli AB55 AB56
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: python scraper.py
      - name: Commit archivio aggiornato
        run: |
          git config user.name "interpelli-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/data.json
          git diff --cached --quiet || git commit -m "Aggiorna interpelli AB55/AB56"
          git push
