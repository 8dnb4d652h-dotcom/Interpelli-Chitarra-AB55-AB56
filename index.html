<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interpelli Chitarra AB55 / AB56</title>
<style>body{font-family:system-ui;margin:0;background:#f4f6f8;color:#17202a}header{background:#17202a;color:#fff;padding:22px}main{max-width:1400px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:#fff;padding:14px;border-radius:12px;box-shadow:0 1px 5px #0001}input,select{padding:10px;border:1px solid #ccd3da;border-radius:8px;width:100%;box-sizing:border-box}table{width:100%;border-collapse:collapse;background:#fff;margin-top:15px}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left}th{background:#eef1f4;position:sticky;top:0}.tag{padding:4px 8px;border-radius:8px;background:#e9eef5;font-weight:700}.new{background:#dff5e5}.muted{color:#65727e}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}table{font-size:13px}}</style></head>
<body><header><h1>🎸 Interpelli Chitarra — AB55 / AB56</h1><div>Monitor nazionale • aggiornamento automatico ogni ora • archivio storico</div></header>
<main><div class="grid"><div class="card"><b>Totale storico</b><h2 id="tot">—</h2></div><div class="card"><b>AB55</b><h2 id="ab55">—</h2></div><div class="card"><b>AB56</b><h2 id="ab56">—</h2></div><div class="card"><b>Ultimo aggiornamento</b><h3 id="upd">—</h3></div></div>
<div class="card" style="margin-top:15px"><div class="grid"><input id="q" placeholder="Cerca scuola, provincia, titolo..."><select id="cdc"><option value="">AB55 + AB56</option><option>AB55</option><option>AB56</option></select><select id="reg"><option value="">Tutte le regioni</option></select><select id="status"><option value="">Tutti</option><option value="attivo">Attivi</option><option value="storico">Storico</option></select></div></div>
<div style="overflow:auto"><table><thead><tr><th>CDC</th><th>Data</th><th>Regione</th><th>Provincia</th><th>Scuola</th><th>Titolo</th><th>Stato</th><th>Fonte</th></tr></thead><tbody id="rows"></tbody></table></div></main>
<script>
let data=[];
async function load(){let r=await fetch('data/data.json?x='+Date.now());let j=await r.json();data=j.items||[];document.getElementById('upd').textContent=j.updated_at?new Date(j.updated_at).toLocaleString('it-IT'):'—';render();}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(){let q=document.getElementById('q').value.toLowerCase(), c=document.getElementById('cdc').value, r=document.getElementById('reg').value, st=document.getElementById('status').value;
let x=data.filter(a=>(!c||a.cdc===c)&&(!r||a.region===r)&&(!st||a.status===st)&&(!q||JSON.stringify(a).toLowerCase().includes(q)));
document.getElementById('tot').textContent=data.length;document.getElementById('ab55').textContent=data.filter(a=>a.cdc==='AB55').length;document.getElementById('ab56').textContent=data.filter(a=>a.cdc==='AB56').length;
document.getElementById('rows').innerHTML=x.map(a=>`<tr><td><span class="tag">${esc(a.cdc)}</span></td><td>${esc(a.published)}</td><td>${esc(a.region)}</td><td>${esc(a.province)}</td><td>${esc(a.school)}</td><td><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a></td><td>${esc(a.status)}</td><td>${esc(a.source)}</td></tr>`).join('')||'<tr><td colspan="8">Nessun risultato</td></tr>';}
document.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',render));load();
</script></body></html>
